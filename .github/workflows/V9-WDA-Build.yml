name: Build WDA

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取 Appium WebDriverAgent 源码
        run: |
          git clone --depth=1 https://github.com/appium/WebDriverAgent.git WebDriverAgent
          ls WebDriverAgent/ | head -10

      - name: 安装依赖
        run: |
          cd WebDriverAgent
          ./Scripts/bootstrap.sh

      - name: 编译未签名真机包
        run: |
          cd WebDriverAgent
          xcodebuild -workspace WebDriverAgent.xcworkspace \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-Runner
          path: WebDriverAgent/build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app
          if-no-files-found: error

      - name: 列出产物核对
        run: |
          ls -la WebDriverAgent/build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app

