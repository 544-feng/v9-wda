name: Build WDA

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取 Appium WebDriverAgent 源码
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master

      - name: 安装依赖
        run: |
          ./Scripts/bootstrap.sh

      - name: 编译未签名真机包
        run: |
          xcodebuild -workspace WebDriverAgent.xcworkspace \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-Runner
          path: build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app
          if-no-files-found: error

      - name: 列出产物核对
        run: |
          ls -la build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app
